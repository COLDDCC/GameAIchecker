name: Astro build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: python3 -m unittest discover -s scripts/review/tests -v
      - run: node --test scripts/sitemap.test.mjs scripts/search-routing.test.mjs
      - run: npm run build
      - run: node scripts/audit-lists.mjs
      - run: node scripts/audit-search.mjs
      - name: Check expected output
        run: |
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/index.html
          test ! -f dist/game/index.html
          test -f dist/events/next-fest/index.html
          test -f dist/evidence/ccr/index.html
          test -f dist/data/community-game-submissions.json
