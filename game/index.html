<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>游戏 AI 档案 | Game AI Checker</title><style>*{box-sizing:border-box}body{margin:0;background:#0a111d;color:#eef7ff;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:22px}a{color:#86e5d5}.box{border:1px solid #355269;background:#14283c;border-radius:16px;padding:22px;margin:18px 0}h1{font-size:clamp(2rem,5vw,3rem);margin-bottom:8px}.muted{color:#b4c6d5}.pill{background:#33475a;border-radius:20px;padding:6px 12px;display:inline-block;font-size:13px}.notice{border-left:3px solid #d8b16c;padding-left:12px}input,button,select{padding:12px;border:1px solid #4a687e;border-radius:10px;background:#1a344b;color:white;font:inherit}button{cursor:pointer}input{width:min(100%,440px)}blockquote{margin:10px 0;border-left:3px solid #80dbca;padding:10px 14px;background:#0e2030}</style></head><body><main><nav><a href="/">◈ Game AI Checker</a> / 游戏档案</nav><h1 id="name">正在加载游戏…</h1><p id="identity" class="muted"></p><section class="box"><h2>AI 使用与证据</h2><p id="status">正在核对现有记录…</p><p id="detail" class="muted"></p><div id="sources"></div></section><section class="box"><h2>玩家反馈</h2><p id="count">暂无反馈数据。</p><div id="comments"></div><p class="notice">玩家的视觉印象不等于 AI 使用事实。反馈人数不能换算成 AI 使用百分比。</p><h3>匿名反馈（无需登录）</h3><p class="muted">仅代表你的个人判断，不是游戏使用 AI 的事实认定。每款游戏每个网络目前仅允许投一票。</p><form id="voteForm"><label for="vote">你认为这款游戏使用了多少 AI？</label><p><select id="vote" required><option value="">请选择</option><option value="no_ai_suspected">我认为没有使用 AI</option><option value="some_ai_suspected">我认为部分使用 AI</option><option value="heavy_ai_suspected">我认为大量使用 AI</option><option value="all_ai_suspected">我认为几乎全程使用 AI</option></select> <button id="submitVote" type="submit">提交反馈</button></p></form><p id="voteMessage" class="muted" role="status"></p><div id="voteCounts"></div><p class="muted">目前暂不支持上传截图。开发者披露与玩家投票分别统计。</p></section><p><a href="/">← 返回搜索</a></p></main><script>const params=new URLSearchParams(location.search),id=params.get('id'),name=params.get('name');const esc=s=>String(s||'');const $=s=>document.querySelector(s);Promise.all([fetch('/data/community-game-submissions.json').then(r=>r.json()).catch(()=>({submissions:[]})),fetch('/data/indie-roguelike-ai-disclosures.json').then(r=>r.json()).catch(()=>({games:[]})),fetch('/data/human-made-game-claims.json').then(r=>r.json()).catch(()=>({games:[]})),fetch('/data/next-fest-100.json').then(r=>r.json()).catch(()=>({games:[]}))]).then(([community,ai,human,fest])=>{const equal=(a,b)=>String(a||'').toLowerCase()===String(b||'').toLowerCase();const c=(community.submissions||[]).find(g=>(id&&equal(g.steamAppId,id))||(name&&equal(g.gameName,name)));const a=(ai.games||[]).find(g=>(id&&equal(g.appId,id))||(name&&equal(g.name,name)));const h=(human.games||[]).find(g=>(id&&equal(g.steamAppId,id))||(name&&equal(g.name,name)));const f=(fest.games||[]).find(g=>(id&&equal(g.steamAppId,id))||(name&&equal(g.name,name)));const gameName=c?.gameName||a?.name||h?.name||f?.name||name||'未找到游戏';const gameId=c?.steamAppId||a?.appId||h?.steamAppId||f?.steamAppId;document.title=gameName+' | Game AI Checker';$('#name').textContent=gameName;$('#identity').textContent=gameId?'Steam App ID: '+gameId:'Steam App ID 尚待核实';const sources=$('#sources');function link(url,label){if(!url||!/^https:\/\//.test(url))return;const p=document.createElement('p'),a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;p.append(a);sources.append(p)}if(a){$('#status').textContent='开发者披露：使用过生成式 AI（开发者自述，非独立审计）';$('#detail').textContent=a.evidenceReview?.developerDisclosureSummary||a.summary||'';link(a.sourceUrl,'查看开发者披露来源 ↗')}else if(h){$('#status').textContent='开发者相关账号声称人工创作；未经独立验证';$('#detail').textContent=h.claimOriginal||h.reviewConclusion||'';link(h.steamUrl,'Steam 游戏页面 ↗')}else if(f?.aiStatus==='official_ai_disclosure'){$('#status').textContent='新品节候选记录中存在 AI 披露';$('#detail').textContent=f.aiEvidence?.[0]?.summary||'详情待核实';link(f.aiEvidence?.[0]?.sourceUrl,'查看披露来源 ↗')}else{$('#status').textContent='AI 使用情况尚未核实';$('#detail').textContent='没有可确认的开发者披露，不等于没有使用 AI。'}if(c){const item=document.createElement('div'),b=document.createElement('span');b.className='pill';b.textContent=c.category==='subjective_caution'?'1 条玩家主观疑虑':'1 条玩家推荐';item.append(b);if(c.opinion){const q=document.createElement('blockquote');q.textContent=c.opinion;item.append(q)}$('#comments').append(item);$('#count').textContent=c.category==='subjective_caution'?'目前 1 位玩家表示该游戏“AI 味很重”（未声称已证实全程使用 AI）。':'目前 1 位玩家推荐该游戏。'}if(!a&&!h&&!f&&c.steamUrl)link(c.steamUrl,'Steam 页面 ↗')}if(!c&&!a&&!h&&!f){$('#status').textContent='尚未收录';$('#detail').textContent='可以返回首页搜索其他游戏。'}const key=gameId?'steam:'+gameId:'name:'+gameName;const voteNames={no_ai_suspected:'认为没有使用 AI',some_ai_suspected:'认为部分使用 AI',heavy_ai_suspected:'认为大量使用 AI',all_ai_suspected:'认为几乎全程使用 AI'};const voteForm=$('#voteForm'),voteMessage=$('#voteMessage'),voteCounts=$('#voteCounts');function showCounts(counts){voteCounts.replaceChildren();for(const [code,label] of Object.entries(voteNames)){const n=Number(counts?.[code]||0);if(!n)continue;const p=document.createElement('p');p.textContent=n+' 位玩家'+label;voteCounts.append(p)}}fetch('/api/feedback?game='+encodeURIComponent(key)).then(async r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{showCounts(x.counts);voteMessage.textContent='反馈功能已启用。'}).catch(()=>{voteForm.hidden=true;voteMessage.textContent='匿名反馈暂未启用，等待网站管理员配置数据库。'});voteForm.addEventListener('submit',async e=>{e.preventDefault();const vote=$('#vote').value;if(!vote)return;$('#submitVote').disabled=true;try{const r=await fetch('/api/feedback',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({game:key,vote})});const x=await r.json();if(!r.ok){voteMessage.textContent=r.status===409?'该网络已对本游戏投过票。':'提交失败，请稍后再试。';if(x.counts)showCounts(x.counts)}else{voteMessage.textContent='反馈已记录，谢谢参与。';showCounts(x.counts);voteForm.hidden=true}}catch{voteMessage.textContent='网络错误，请稍后重试。'}finally{$('#submitVote').disabled=false}})})</script></body></html>
