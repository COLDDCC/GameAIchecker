<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/logo.svg"><meta name="theme-color" content="#ffffff"><title>游戏 AI 档案 | Game AI Checker</title><style>*{box-sizing:border-box}body{margin:0;background:#ffffff;color:#182437;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:22px}a{color:#1f8fff}.box{border:1px solid #e5eaf0;background:#ffffff;border-radius:16px;padding:22px;margin:18px 0}h1{font-size:clamp(2rem,5vw,3rem);margin-bottom:8px}.muted{color:#667085}.pill{background:#eef2f7;border-radius:20px;padding:6px 12px;display:inline-block;font-size:13px}.notice{border-left:3px solid #d8b16c;padding-left:12px}input,button,select{padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#ffffff;color:#182437;font:inherit}button{cursor:pointer}input{width:min(100%,440px)}header.game-hero{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px;align-items:center;margin:20px 0}.game-cover{width:100%;aspect-ratio:460/215;object-fit:cover;border-radius:14px;background:#f1f5f9;border:1px solid #e5eaf0}.game-cover[hidden]{display:none}.game-hero h1{margin:0 0 10px;overflow-wrap:anywhere;line-height:1.2}@media(max-width:600px){header.game-hero{grid-template-columns:1fr;gap:12px}.game-cover{max-width:460px}}body{background:#fff;color:#182437}.box{background:#f8fafc}.pill{background:#eaf1ff;color:#1d4ed8}input,button,select{background:#fff;color:#182437}button{background:#1f8fff;color:#fff}blockquote{margin:10px 0;border-left:3px solid #1f8fff;padding:10px 14px;background:#f6f8fb}.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.media-grid a{display:block}.media-grid img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#eef2f7}.media-grid img:hover{outline:2px solid #1f8fff}.media-note{font-size:.85rem;color:#667085}.media-grid a[hidden]{display:none}@media(max-width:560px){.media-grid{grid-template-columns:1fr}}</style></head><body><main><nav><a href="/" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:750"><img src="/logo.svg" alt="" width="42" height="34">Game AI Checker</a> / 游戏档案</nav><header class="game-hero"><img id="gameCover" class="game-cover" alt="游戏 Steam 封面" hidden><div><h1 id="name">正在加载游戏…</h1><p id="identity" class="muted"></p><div id="eventTags"></div></div></header><section class="box" id="mediaSection"><h2>游戏图片与截图</h2><p class="media-note" id="mediaStatus">正在读取 Steam 官方商店图片…</p><div id="mediaGrid" class="media-grid"></div><p class="media-note">图片来自对应游戏的 Steam 商店页面，仅用于识别游戏及查看玩法画面。图片版权归各自权利人所有。<a id="mediaSource" target="_blank" rel="noopener noreferrer">查看 Steam 原始页面 ↗</a></p></section><section class="box"><h2>AI 使用与证据</h2><p id="status">正在核对现有记录…</p><p id="detail" class="muted"></p><div id="sources"></div></section><section class="box"><h2>玩家反馈</h2><p id="count">暂无反馈数据。</p><div id="comments"></div><p class="notice">玩家的视觉印象不等于 AI 使用事实。反馈人数不能换算成 AI 使用百分比。</p><h3>匿名反馈（无需登录）</h3><p class="muted">仅代表你的个人判断，不是游戏使用 AI 的事实认定。每款游戏每个网络目前仅允许投一票。</p><form id="voteForm"><label for="vote">你认为这款游戏使用了多少 AI？</label><p><select id="vote" required><option value="">请选择</option><option value="no_ai_suspected">我认为没有使用 AI</option><option value="some_ai_suspected">我认为部分使用 AI</option><option value="heavy_ai_suspected">我认为大量使用 AI</option><option value="all_ai_suspected">我认为几乎全程使用 AI</option></select> <button id="submitVote" type="submit">提交反馈</button></p></form><p id="voteMessage" class="muted" role="status"></p><div id="voteCounts"></div><p class="muted">目前暂不支持上传截图。开发者披露与玩家投票分别统计。</p></section><p><a href="/">← 返回搜索</a></p></main><script>const params=new URLSearchParams(location.search),id=params.get('id'),name=params.get('name');const esc=s=>String(s||'');const $=s=>document.querySelector(s);if(id||name){fetch('/data/game-index.json').then(r=>r.ok?r.json():null).then(d=>{if(!d)return;const g=(d.games||[]).find(x=>(id&&String(x.appId)===String(id))||(name&&String(x.name).toLowerCase()===String(name).toLowerCase()));if(g&&g.hasStatic)location.replace('/games/'+g.slug+'/')}).catch(()=>{});}if(!id&&!name){$('#name').textContent='请选择一款游戏';$('#identity').innerHTML='从 <a href="/">首页搜索</a> 或 <a href="/games/">游戏列表</a> 打开具体游戏档案。';$('#mediaStatus').textContent='选择游戏后即可查看官方封面和截图。';$('#mediaSource').hidden=true;$('#status').textContent='尚未选择游戏';$('#detail').textContent='请先选择一款游戏，系统才能匹配对应的 Steam App ID 和证据。';$('#voteForm').hidden=true;$('#voteMessage').textContent='请选择游戏后再查看玩家反馈。';}else{document.querySelector('#name').textContent=name||('Steam 游戏 '+id);document.querySelector('#identity').textContent=id?'Steam App ID: '+id:'正在匹配游戏资料';}if(id||name)Promise.all([fetch('/data/community-game-submissions.json').then(r=>r.json()).catch(()=>({submissions:[]})),fetch('/data/indie-roguelike-ai-disclosures.json').then(r=>r.json()).catch(()=>({games:[]})),fetch('/data/human-made-game-claims.json').then(r=>r.json()).catch(()=>({games:[]})),fetch('/data/next-fest-100.json').then(r=>r.json()).catch(()=>({games:[]}))]).then(([community,ai,human,fest])=>{const equal=(a,b)=>String(a||'').toLowerCase()===String(b||'').toLowerCase();const c=(community.submissions||[]).find(g=>(id&&equal(g.steamAppId,id))||(name&&equal(g.gameName,name)));const a=(ai.games||[]).find(g=>(id&&equal(g.appId,id))||(name&&equal(g.name,name)));const h=(human.games||[]).find(g=>(id&&equal(g.steamAppId,id))||(name&&equal(g.name,name)));const f=(fest.games||[]).find(g=>(id&&equal(g.steamAppId,id))||(name&&equal(g.name,name)));const gameName=c?.gameName||a?.name||h?.name||f?.name||name||'未找到游戏';const gameId=c?.steamAppId||a?.appId||h?.steamAppId||f?.steamAppId;document.title=gameName+' | Game AI Checker';$('#name').textContent=gameName;$('#identity').textContent=gameId?'Steam App ID: '+gameId:'Steam App ID 尚待核实';const cover=$('#gameCover');if(gameId){cover.hidden=false;cover.src='/images/steam/apps/'+encodeURIComponent(gameId)+'/header.jpg';cover.alt=gameName+' — Steam 游戏封面';cover.onerror=()=>{cover.onerror=null;cover.src='https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/'+encodeURIComponent(gameId)+'/header.jpg';cover.onerror=()=>{cover.onerror=null;cover.src='https://cdn.cloudflare.steamstatic.com/steam/apps/'+encodeURIComponent(gameId)+'/header.jpg';cover.onerror=()=>{cover.hidden=true}}};}const mediaGrid=$('#mediaGrid'),mediaStatus=$('#mediaStatus'),mediaSource=$('#mediaSource');if(gameId){mediaSource.href='https://store.steampowered.com/app/'+encodeURIComponent(gameId)+'/';fetch('/api/steam-media?id='+encodeURIComponent(gameId)).then(async r=>{if(!r.ok)throw Error('unavailable');return r.json()}).then(m=>{if(!m.available)throw Error('unavailable');const shots=m.screenshots||[];mediaGrid.replaceChildren();for(const shot of shots){const src=shot.thumbnail||shot.full;if(!src)continue;const a=document.createElement('a');a.href=shot.full||src;a.target='_blank';a.rel='noopener noreferrer';const img=document.createElement('img');img.loading='lazy';img.decoding='async';img.src=src;img.alt=gameName+' — Steam 游戏截图';img.onerror=()=>a.remove();a.append(img);mediaGrid.append(a)}mediaStatus.textContent=shots.length?'Steam 商店截图 · '+shots.length+' 张（点击查看原图）':'Steam 商店未提供可读取的游戏截图。';if(m.header&&cover.hidden){cover.hidden=false;cover.src=m.header;}}).catch(()=>{mediaStatus.textContent='暂时无法读取 Steam 截图，请通过下方链接查看官方商店图片。';});}else{mediaStatus.textContent='尚未确认对应 Steam App ID，暂不展示可能错误的游戏图片。';mediaSource.hidden=true;}const tags=$('#eventTags');if(f){const tag=document.createElement('span');tag.className='pill';tag.textContent='Steam Next Fest · October 2026 · third-party-listed candidate';tags.append(tag)}const sources=$('#sources');function link(url,label){if(!url||!/^https:\/\//.test(url))return;const p=document.createElement('p'),a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;p.append(a);sources.append(p)}if(a){$('#status').textContent='开发者披露：使用过生成式 AI（开发者自述，非独立审计）';$('#detail').textContent=a.evidenceReview?.developerDisclosureSummary||a.summary||'';link(a.sourceUrl,'查看开发者披露来源 ↗')}else if(h){$('#status').textContent='开发者相关账号声称人工创作；未经独立验证';$('#detail').textContent=h.claimOriginal||h.reviewConclusion||'';link(h.steamUrl,'Steam 游戏页面 ↗')}else if(f?.aiStatus==='official_ai_disclosure'){$('#status').textContent='新品节候选记录中存在 AI 披露';$('#detail').textContent=f.aiEvidence?.[0]?.summary||'详情待核实';link(f.aiEvidence?.[0]?.sourceUrl,'查看披露来源 ↗')}else{$('#status').textContent='AI 使用情况尚未核实';$('#detail').textContent='没有可确认的开发者披露，不等于没有使用 AI。'}if(c){const item=document.createElement('div'),b=document.createElement('span');b.className='pill';b.textContent=c.category==='subjective_caution'?'1 条玩家主观疑虑':'1 条玩家推荐';item.append(b);if(c.opinion){const q=document.createElement('blockquote');q.textContent=c.opinion;item.append(q)}$('#comments').append(item);$('#count').textContent=c.category==='subjective_caution'?'目前 1 位玩家表示该游戏“AI 味很重”（未声称已证实全程使用 AI）。':'目前 1 位玩家推荐该游戏。'}if(!a&&!h&&!f&&c.steamUrl)link(c.steamUrl,'Steam 页面 ↗')}if(!c&&!a&&!h&&!f){$('#status').textContent='尚未收录';$('#detail').textContent='可以返回首页搜索其他游戏。'}const key=gameId?'steam:'+gameId:'name:'+gameName;const voteNames={no_ai_suspected:'认为没有使用 AI',some_ai_suspected:'认为部分使用 AI',heavy_ai_suspected:'认为大量使用 AI',all_ai_suspected:'认为几乎全程使用 AI'};const voteForm=$('#voteForm'),voteMessage=$('#voteMessage'),voteCounts=$('#voteCounts');function showCounts(counts){voteCounts.replaceChildren();for(const [code,label] of Object.entries(voteNames)){const n=Number(counts?.[code]||0);if(!n)continue;const p=document.createElement('p');p.textContent=n+' 位玩家'+label;voteCounts.append(p)}}fetch('/api/feedback?game='+encodeURIComponent(key)).then(async r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{showCounts(x.counts);voteMessage.textContent='反馈功能已启用。'}).catch(()=>{voteForm.hidden=true;voteMessage.textContent='匿名反馈暂未启用，等待网站管理员配置数据库。'});voteForm.addEventListener('submit',async e=>{e.preventDefault();const vote=$('#vote').value;if(!vote)return;$('#submitVote').disabled=true;try{const r=await fetch('/api/feedback',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({game:key,vote})});const x=await r.json();if(!r.ok){voteMessage.textContent=r.status===409?'该网络已对本游戏投过票。':'提交失败，请稍后再试。';if(x.counts)showCounts(x.counts)}else{voteMessage.textContent='反馈已记录，谢谢参与。';showCounts(x.counts);voteForm.hidden=true}}catch{voteMessage.textContent='网络错误，请稍后重试。'}finally{$('#submitVote').disabled=false}})}).catch(()=>{$('#name').textContent=name||('Steam 游戏 '+(id||''));$('#identity').textContent='游戏资料暂时无法读取';$('#mediaStatus').textContent='暂时无法加载截图，请稍后刷新。';$('#status').textContent='数据读取失败';$('#detail').textContent='游戏数据库暂时不可用，请返回首页重新选择游戏。';$('#voteForm').hidden=true;})</script></body></html>
