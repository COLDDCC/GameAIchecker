<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玩家安利与避雷墙 | Game AI Checker</title><meta name="description" content="社区玩家推荐和主观避雷游戏清单。主观 AI 画风印象不等于游戏实际使用生成式 AI。"><style>*{box-sizing:border-box}body{margin:0;background:#0a111d;color:#edf5ff;font:16px/1.6 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}a{color:#87e5d5}h1{font-size:clamp(2rem,5vw,3.5rem);margin:24px 0 8px}.intro{color:#b6c9d8;max-width:760px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button,input{border:1px solid #38536c;border-radius:10px;padding:11px 15px;background:#14273b;color:white;font:inherit}button{cursor:pointer}button[aria-pressed="true"]{background:#275b57;border-color:#7be3d0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card{background:#142539;border:1px solid #30485d;border-radius:15px;padding:19px}.card h2{font-size:19px;margin:0 0 10px}.tag{display:inline-block;border-radius:18px;background:#245346;color:#b8f7df;font-size:12px;padding:4px 10px}.tag.caution{background:#574832;color:#ffe3b0}.muted{color:#aabed0;font-size:14px}.notice{border-left:3px solid #dfb56d;padding-left:13px;margin:20px 0;color:#bdcbd7}footer{margin-top:32px;border-top:1px solid #30485d;padding-top:20px;color:#9eb1c3}</style></head><body><main><nav><a href="/">◈ Game AI Checker</a> · <a href="/events/next-fest/">新品节目录</a> · <a href="/indie-ai/">AI 披露记录</a></nav><h1>玩家安利与避雷墙</h1><p class="intro">玩家说好玩，可以先收藏；玩家说“AI 味太重”，也可以记录感受。但主观画风印象不等于已证实使用生成式 AI。这里不收集社交账号 ID。</p><div class="filters"><input id="q" type="search" placeholder="搜索游戏名称…" aria-label="搜索游戏"><button data-type="all" aria-pressed="true">全部</button><button data-type="recommended" aria-pressed="false">玩家安利</button><button data-type="subjective_caution" aria-pressed="false">主观避雷</button></div><p id="count" class="muted">正在加载…</p><section id="grid" class="grid"></section><p class="notice">投稿内容仅代表玩家观点，不构成事实认定、AI 使用鉴定或对开发者的指控。缺少来源截图的投稿会标注为“来源待补充”。</p><footer>Game AI Checker · 社区投稿与官方开发者披露分开展示</footer></main><script>fetch('/data/community-game-submissions.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const list=d.submissions||[],grid=document.querySelector('#grid'),q=document.querySelector('#q'),buttons=[...document.querySelectorAll('button[data-type]')];let type='all';function render(){const matches=list.filter(g=>(type==='all'||g.category===type)&&g.gameName.toLowerCase().includes(q.value.trim().toLowerCase()));document.querySelector('#count').textContent=matches.length+' / '+list.length+' 条玩家投稿';grid.replaceChildren(...matches.map(g=>{const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=g.gameName;const tag=document.createElement('span');tag.className='tag'+(g.category==='subjective_caution'?' caution':'');tag.textContent=g.category==='recommended'?'玩家安利':'玩家主观避雷';const p=document.createElement('p');p.textContent=g.category==='recommended'?'玩家推荐，尚不代表已经验证为无 AI 游戏。':'玩家主观评价：“'+(g.opinion||'有疑虑')+'”。未证实实际使用生成式 AI。';const status=document.createElement('p');status.className='muted';status.textContent=g.steamAppId?'已匹配 Steam 游戏 · AI 状态未审核':'游戏身份待核实 · 投稿截图待补充';card.append(h,tag,p,status);if(g.steamUrl){const a=document.createElement('a');a.href=g.steamUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Steam 页面 ↗';card.append(a)}return card}));}q.addEventListener('input',render);buttons.forEach(b=>b.addEventListener('click',()=>{type=b.dataset.type;buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));render()}).catch(()=>document.querySelector('#count').textContent='投稿数据暂时无法加载。');</script></body></html>
